<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .caja{
      background-color: blue;
      width: 100px;
      height: 100px;
      border: solid greenyellow 3px;
      color: aquamarine;
      text-align: center;
    }
    #caja3 {
      position: static;
      top:50px;
      left: 50px;
    }
    #caja4 {
      position: absolute;
      top:50px;
      left: 50px;
    }
    #caja6 {
      position: relative;
      top:50px;
      left: 50px;
    }
    #caja8 {
      position: fixed;
      top:50px;
      left: 50px;
    }
    #caja10 {
      position: sticky;
      top:50px;
      left: 50px;
    }
  </style>
</head>
<body>
  <div class="caja" id="caja1">Contenido 1</div>
  <div class="caja" id="caja2">Contenido 2</div>
  <div class="caja" id="caja3">Contenido 3</div>
  <div class="caja" id="caja4">Contenido 4</div>
  <div class="caja" id="caja5">Contenido 5</div>
  <div class="caja" id="caja6">Contenido 6</div>
  <div class="caja" id="caja7">Contenido 7</div>
  <div class="caja" id="caja8">Contenido 8</div>
  <div class="caja" id="caja9">Contenido 9</div>
  <div class="caja" id="caja10">Contenido 10</div>
</body>
</html>
